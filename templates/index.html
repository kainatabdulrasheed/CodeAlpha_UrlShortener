<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #4B1F73;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .card {
            background: #6D3BB8;
            border-radius: 20px;
            padding: 48px 40px;
            width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #F3EEE7;
            text-align: center;
            font-size: 26px;
            margin-bottom: 32px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input[type="text"] {
            background: #CBB8E8;
            border: none;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 15px;
            color: #2B2B2E;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        input[type="text"]::placeholder {
            color: #4B1F73;
            opacity: 0.6;
        }

        button {
            background: #2B2B2E;
            color: #F3EEE7;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 20px;
            background: #CBB8E8;
            border-radius: 12px;
            padding: 16px 18px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .result-box a {
            color: #4B1F73;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
        }

        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>URL Shortener</h1>
        <form method="POST" action="/">
            <input type="text" name="long_url" placeholder="Paste your long URL here" required>
            <button type="submit">Shorten</button>
        </form>

        {% if short_url %}
        <div class="result-box">
            <a href="{{ short_url }}">{{ short_url }}</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
